log:
  level: INFO

entryPoints:
  web:
    # http
    address: ':80'
    http:
      # https://doc.traefik.io/traefik/routing/entrypoints/#entrypoint
      redirections:
        entryPoint:
          to: web-secure

  web-secure:
    # https
    address: ':443'

certificatesResolvers:
  letsencrypt:
    # https://doc.traefik.io/traefik/https/acme/#lets-encrypt
    acme:
      email: 'abdoeladawy4@gmail.com'
      storage: /etc/traefik/acme/acme.json
      # https://doc.traefik.io/traefik/https/acme/#httpchallenge
      httpChallenge:
        entryPoint: web

http:
  routers:
    # ecosolaris.kresh-ng.de -> Next.js frontend (runs in the kresh_energy_fe compose project,
    # reachable over the shared external "kresh_web" docker network).
    frontend-router:
      rule: 'Host(`ecosolaris.kresh-ng.de`) || Host(`www.ecosolaris.kresh-ng.de`)'
      entryPoints:
        - web-secure
      service: frontend
      tls:
        certResolver: letsencrypt

    # ecosolaris-api.kresh-ng.de -> Django (DRF API, admin, static & media).
    api-router:
      rule: 'Host(`ecosolaris-api.kresh-ng.de`)'
      entryPoints:
        - web-secure
      middlewares:
        - csrf
      service: django
      tls:
        # https://doc.traefik.io/traefik/routing/routers/#certresolver
        certResolver: letsencrypt

    # Brand-protection domains: ecosolaris.kresh-ng.com / .org 301-redirect to the
    # canonical ecosolaris.kresh-ng.de. No app runs behind these.
    redirect-com-router:
      rule: 'Host(`ecosolaris.kresh-ng.com`)'
      entryPoints:
        - web-secure
      middlewares:
        - redirect-canonical
      service: frontend
      tls:
        certResolver: letsencrypt

    redirect-org-router:
      rule: 'Host(`ecosolaris.kresh-ng.org`)'
      entryPoints:
        - web-secure
      middlewares:
        - redirect-canonical
      service: frontend
      tls:
        certResolver: letsencrypt

  middlewares:
    csrf:
      # https://doc.traefik.io/traefik/master/middlewares/http/headers/#hostsproxyheaders
      # https://docs.djangoproject.com/en/dev/ref/csrf/#ajax
      headers:
        hostsProxyHeaders: ['X-CSRFToken']

    redirect-canonical:
      # https://doc.traefik.io/traefik/middlewares/http/redirectregex/
      redirectRegex:
        regex: '^https://ecosolaris\.kresh-ng\.(?:com|org)(/.*)?$'
        replacement: 'https://ecosolaris.kresh-ng.de${1}'
        permanent: true

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:3000

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
