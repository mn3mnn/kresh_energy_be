log:
  level: INFO

entryPoints:
  web:
    # http
    address: ':80'
    http:
      # https://doc.traefik.io/traefik/routing/entrypoints/#entrypoint
      redirections:
        entryPoint:
          to: web-secure

  web-secure:
    # https
    address: ':443'

certificatesResolvers:
  letsencrypt:
    # https://doc.traefik.io/traefik/https/acme/#lets-encrypt
    acme:
      email: 'abdoeladawy4@gmail.com'
      storage: /etc/traefik/acme/acme.json
      # https://doc.traefik.io/traefik/https/acme/#httpchallenge
      httpChallenge:
        entryPoint: web

http:
  routers:
    # Root domain -> Next.js frontend (runs in the kresh_energy_fe compose project,
    # reachable over the shared external "kresh_web" docker network).
    frontend-router:
      rule: 'Host(`service.kresh-gmbh.de`) || Host(`www.service.kresh-gmbh.de`)'
      entryPoints:
        - web-secure
      service: frontend
      tls:
        certResolver: letsencrypt

    # api.service.kresh-gmbh.de -> Django (DRF API, admin, static & media).
    api-router:
      rule: 'Host(`api.service.kresh-gmbh.de`)'
      entryPoints:
        - web-secure
      middlewares:
        - csrf
      service: django
      tls:
        # https://doc.traefik.io/traefik/routing/routers/#certresolver
        certResolver: letsencrypt

  middlewares:
    csrf:
      # https://doc.traefik.io/traefik/master/middlewares/http/headers/#hostsproxyheaders
      # https://docs.djangoproject.com/en/dev/ref/csrf/#ajax
      headers:
        hostsProxyHeaders: ['X-CSRFToken']

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:3000

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
