services:
  docs:
    image: kresh_energy_be_local_docs
    container_name: kresh_energy_be_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./kresh_energy_be:/app/kresh_energy_be:z
    ports:
      - '9000:9000'
    command: /start-docs
