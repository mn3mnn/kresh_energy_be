<!DOCTYPE html>
<html lang="{{ locale }}" dir="{% if locale == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f5; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f5; padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e6ece8;">
        <tr>
          <td style="background-color:#0a9d5a; padding:20px 32px;">
            <span style="color:#ffffff; font-size:18px; font-weight:700; letter-spacing:0.02em;">Kresh EcoSolaris</span>
          </td>
        </tr>
        <tr>
          <td style="padding:32px; color:#0d1512; font-size:15px; line-height:1.6;">
            {{ body|linebreaks }}
          </td>
        </tr>
        <tr>
          <td style="background-color:#f7faf8; padding:16px 32px; border-top:3px solid #ffb232;">
            <span style="color:#56645d; font-size:12px;">Kresh EcoSolaris &middot; kresh-ng.de</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
