volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}

networks:
  # Shared with the kresh_energy_fe (Next.js) compose project so Traefik can
  # route the root domain to the frontend container. Create it once on the host:
  #   docker network create kresh_web
  kresh_web:
    external: true



services:
  django:
    # Image is built and pushed to GHCR by .github/workflows/deploy.yml; the VPS
    # pulls it (no on-server build). Tag is overridable via the DJANGO_IMAGE env
    # var so a deploy can pin a specific SHA instead of latest.
    image: ${DJANGO_IMAGE:-ghcr.io/mn3mnn/kresh_energy_be:latest}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: kresh_energy_be_production_postgres
    restart: unless-stopped
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: kresh_energy_be_production_traefik
    restart: unless-stopped
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    networks:
      # `default` reaches django/redis; `kresh_web` reaches the frontend container.
      - default
      - kresh_web

  redis:
    image: docker.io/redis:8.8
    restart: unless-stopped


  awscli:
    build:
      context: .
      dockerfile: ./compose/production/aws/Dockerfile
    env_file:
      - ./.envs/.production/.django
    volumes:
      - production_postgres_data_backups:/backups:z
